<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>Dlimans Supermarket POS</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f}
#posFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#07111f}
#commBtn{position:fixed;right:14px;top:76px;z-index:9999;border:1px solid #00e676;background:#071a16;color:#fff;border-radius:12px;padding:10px 13px;font-weight:800;box-shadow:0 8px 25px #0008;display:none}
#commPanel{position:fixed;inset:0;z-index:10000;display:none;background:#07111f}
#commPanel.open{display:block}
#commFrame{width:100%;height:100%;border:0}
#closeComm{position:absolute;right:12px;top:12px;z-index:10001;border:1px solid #00e676;background:#071a16;color:#fff;border-radius:10px;padding:9px 12px;font-weight:800}
</style>
</head>
<body>
<iframe id="posFrame" src="Dlimans_POS_REFRESH_DEFINITIVE_FIXED.html" title="Dlimans Supermarket POS"></iframe>
<button id="commBtn" type="button">💬 Communication</button>
<div id="commPanel">
  <button id="closeComm" type="button">← Back to POS</button>
  <iframe id="commFrame" src="Dlimans_Communication_ALL_IN_ONE.html" title="Dlimans Communication"></iframe>
</div>
<script>
(function(){
 const pos=document.getElementById('posFrame');
 const btn=document.getElementById('commBtn');
 const panel=document.getElementById('commPanel');
 const close=document.getElementById('closeComm');
 // Keep the original master POS untouched. The communication layer is an add-on.
 function showButton(){btn.style.display='block'}
 pos.addEventListener('load',function(){
   // Show after the master has loaded. It remains harmless on the login screen.
   showButton();
 });
 btn.addEventListener('click',function(){panel.classList.add('open')});
 close.addEventListener('click',function(){panel.classList.remove('open')});
 window.addEventListener('message',function(e){
   if(e.data==='dlimans-close-communication') panel.classList.remove('open');
 });
})();
</script>
</body>
</html>
